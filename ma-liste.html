<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Ma liste – Turgot+</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/common.css">
<style>
.container { max-width: 1440px; margin: auto; padding: calc(var(--nav-h) + 40px) 36px 80px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 16px; margin-bottom: 28px; }
.page-head h1 { font-family: var(--font-ui); font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; }
.page-head .count { font-size: 0.82rem; color: var(--text-3); font-family: var(--font-ui); }

.card-watched-badge {
  position: absolute; top: 9px; left: 9px;
  background: rgba(34,197,94,0.85); backdrop-filter: blur(4px);
  border-radius: 6px; padding: 3px 7px;
  font-size: 0.68rem; font-weight: 700; font-family: var(--font-ui);
  color: white; letter-spacing: 0.03em; text-transform: uppercase;
}

.card-btn.btn-watched { background: var(--green-dim); border-color: rgba(34,197,94,0.3); color: var(--green); }
.card-btn.btn-watched.done { background: rgba(34,197,94,0.35); color: white; }
.card-btn.btn-remove { background: rgba(240,68,68,0.12); border-color: rgba(240,68,68,0.25); color: #f08080; }
.card-btn.btn-remove:hover { background: rgba(240,68,68,0.25); color: white; }

.login-prompt { text-align: center; padding: 100px 20px; }
.login-prompt p { color: var(--text-2); font-size: 0.9rem; }
.login-prompt a { color: var(--blue); font-weight: 600; text-decoration: none; }

.card img.poster-fallback {
  background: linear-gradient(135deg, var(--bg-3), var(--bg-4));
  object-fit: contain;
  padding: 30%;
  filter: opacity(0.4);
}

@media(max-width:600px){ .container { padding: calc(var(--nav-h)+28px) 16px 60px; } }
</style>
</head>
<body>
<div id="preloader">
  <div class="loader"></div>
</div>

<nav id="main-nav"></nav>
<div class="container">
  <div class="page-head">
    <div>
      <h1>Ma liste</h1>
      <span class="count" id="count"></span>
    </div>
    <div class="pills" id="filters">
      <button class="pill active" data-f="all">Tout</button>
      <button class="pill" data-f="movie">Films</button>
      <button class="pill" data-f="tv">Séries</button>
      <button class="pill" data-f="watched">Vus</button>
      <button class="pill" data-f="unwatched">À voir</button>
    </div>
  </div>
  <div id="grid-wrap"></div>
</div>
<footer>© 2025 Turgot+</footer>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
import { SUPABASE_URL, SUPABASE_KEY, injectNav, loader, ICONS } from './js/config.js';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
window.__signOut = async()=>{await sb.auth.signOut();window.location.href='connexion.html';};
let session=null, all=[], currentFilter='all';

const {data}=await sb.auth.getSession(); session=data.session; injectNav('liste',session);
if (!session) {
  document.getElementById('grid-wrap').innerHTML=`<div class="login-prompt"><p>Tu dois être <a href="connexion.html">connecté</a> pour voir ta liste.</p></div>`;
} else {
  document.getElementById('grid-wrap').innerHTML = loader();
  const {data:wl}=await sb.from('watchlist').select('*').eq('user_id',session.user.id).order('added_at',{ascending:false});
  all = wl||[];
  render();
  document.querySelectorAll('.pill').forEach(btn=>{
    btn.addEventListener('click',()=>{
      currentFilter=btn.dataset.f;
      document.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active'); render();
    });
  });
}

function filtered() {
  if (currentFilter==='all') return all;
  if (currentFilter==='watched') return all.filter(i=>i.watched);
  if (currentFilter==='unwatched') return all.filter(i=>!i.watched);
  return all.filter(i=>i.media_type===currentFilter);
}

function render() {
  const items = filtered();
  const count = document.getElementById('count');
  count.textContent = all.length ? `${all.length} titre${all.length>1?'s':''}` : '';
  const wrap = document.getElementById('grid-wrap');
  if (!items.length) {
    wrap.innerHTML=`<div class="empty-state">${ICONS.list}<h3>Liste vide</h3><p>Ajoute des titres depuis Films, Séries ou Recherche.</p></div>`;
    return;
  }
  const grid = document.createElement('div'); grid.className='cards-grid';
  items.forEach(item => {
    const href = `details.html?id=${item.tmdb_id}&type=${item.media_type}`;
    const card = document.createElement('a'); card.className='card'; card.href=href;
    const posterSrc = item.poster ? `https://image.tmdb.org/t/p/w500${item.poster}` : '';
    const title = item.title || 'Sans titre';
    card.innerHTML=`
      ${item.watched?'<div class="card-watched-badge">Vu</div>':''}
      <img src="${posterSrc}" alt="${title}" loading="lazy"
           ${posterSrc?'':'class="poster-fallback"'}
           onerror="this.classList.add('poster-fallback');this.src='data:image/svg+xml;utf8,&lt;svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%23424d66%22&gt;&lt;path d=%22M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm2 4v8l4-4 4 4 4-4v4H6z%22/&gt;&lt;/svg&gt;';">
      <div class="card-info"><h3>${title}</h3><span>${item.media_type==='movie'?'Film':'Série'}</span></div>
      <div class="card-actions" style="flex-direction:column">
        <button class="card-btn btn-watched ${item.watched?'done':''}" title="${item.watched?'Marquer non vu':'Marquer vu'}">${item.watched?ICONS.check:ICONS.eye}</button>
        <button class="card-btn btn-remove" title="Retirer">${ICONS.trash}</button>
      </div>`;
    card.querySelector('.btn-watched').addEventListener('click',async e=>{
      e.preventDefault();e.stopPropagation();
      const newVal=!item.watched;
      await sb.from('watchlist').update({watched:newVal}).eq('user_id',session.user.id).eq('tmdb_id',item.tmdb_id).eq('media_type',item.media_type);
      item.watched=newVal; render();
    });
    card.querySelector('.btn-remove').addEventListener('click',async e=>{
      e.preventDefault();e.stopPropagation();
      await sb.from('watchlist').delete().eq('user_id',session.user.id).eq('tmdb_id',item.tmdb_id).eq('media_type',item.media_type);
      all=all.filter(i=>!(i.tmdb_id===item.tmdb_id&&i.media_type===item.media_type)); render();
    });
    grid.appendChild(card);
  });
  wrap.innerHTML=''; wrap.appendChild(grid);
}
</script>
</body>
</html>
