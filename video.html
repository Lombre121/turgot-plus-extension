<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Lecteur – Turgot+</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/common.css">

<style>
/* ════════════════════════════════════════
   LAYOUT
   ════════════════════════════════════════ */
.container {
  max-width: 1060px;
  margin: auto;
  padding: calc(var(--nav-h) + 28px) 24px 80px;
}

.video-meta-row { text-align: center; margin-bottom: 18px; position: relative; }
.video-title-el {
  font-family: var(--font-ui);
  font-size: 1.7rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  margin-bottom: 5px;
}
.video-meta-el { font-size: 0.82rem; color: var(--text-3); }

.btn-back {
  position: absolute;
  left: 0; top: 4px;
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--bg-3); color: var(--text-2);
  border: 1px solid var(--border-2);
  border-radius: var(--radius);
  padding: 7px 12px; font: 600 .8rem var(--font-ui);
  cursor: pointer; transition: all .18s;
}
.btn-back:hover { color: var(--text); border-color: var(--border-3); background: var(--bg-4); }
.btn-back svg { width: 14px; height: 14px; }
@media(max-width:600px){
  .btn-back { padding: 6px 10px; font-size: .75rem; }
  .btn-back span { display: none; }
}

/* Sources picker (in player menu) */
.cp-src-list { display: flex; flex-direction: column; gap: 2px; max-height: 50vh; overflow-y: auto; }
.cp-src-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px;
}
.cp-src-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.cp-src-main { flex: 1; display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.cp-src-main b { font-weight: 700; }
.cp-src-lang { font-size: .72rem; color: rgba(255,255,255,0.7); margin-left: 4px; }
.cp-src-q { display: block; font-size: .72rem; color: rgba(255,255,255,0.55); }
.cp-src-ms { font-size: .68rem; color: rgba(255,255,255,0.45); font-variant-numeric: tabular-nums; flex: none; }
.cp-src-badge {
  display: inline-block; padding: 1px 6px; border-radius: 4px;
  font-size: .62rem; font-weight: 700; letter-spacing: .03em;
  margin-left: 6px; vertical-align: middle;
}
.cp-src-badge-op   { background: rgba(168,85,247,.2);  color: #c4a3ff; }
.cp-src-badge-flux { background: rgba(34,197,94,.18);  color: #6fe49a; }

/* ════════════════════════════════════════
   SERVERS
   ════════════════════════════════════════ */
.servers-row {
  display: flex; gap: 7px; flex-wrap: wrap;
  justify-content: center; margin-bottom: 14px;
}
.server-btn {
  padding: 7px 16px;
  border-radius: var(--radius);
  border: 1px solid var(--border-2);
  background: var(--bg-3); color: var(--text-2);
  font-weight: 600; font-size: 0.8rem;
  cursor: pointer; transition: all 0.18s;
  font-family: var(--font-ui);
}
.server-btn:hover { border-color: var(--border-3); color: var(--text); }
.server-btn.active {
  background: var(--bg-5); border-color: var(--blue); color: var(--text);
}
.server-btn.archive {
  border-color: rgba(34,197,94,0.45);
  color: #5fe49a;
}
.server-btn.archive.active {
  background: var(--green-dim);
  border-color: var(--green);
  color: var(--green);
}
.server-btn.nexus {
  border-color: rgba(168,85,247,0.45);
  color: #c084fc;
}
.server-btn.nexus.active {
  background: rgba(168,85,247,0.15);
  border-color: rgba(168,85,247,0.7);
  color: #d8b4fe;
}

/* ════════════════════════════════════════
   PLAYER WRAP (iframe ou custom)
   ════════════════════════════════════════ */
.player-wrap {
  background: #000;
  border-radius: var(--radius-xl);
  overflow: hidden;
  aspect-ratio: 16/9;
  box-shadow: var(--shadow-xl);
  border: 1px solid var(--border);
  position: relative;
}
.player-wrap iframe {
  width: 100%; height: 100%; border: none; display: block;
}

/* ════════════════════════════════════════
   CUSTOM MP4 PLAYER
   ════════════════════════════════════════ */
.cp { position: relative; width: 100%; height: 100%; background: #000; color: #fff; }
.cp-video {
  width: 100%; height: 100%;
  object-fit: contain;
  display: block;
  background: #000;
}
.cp.fit-cover .cp-video { object-fit: cover; }

.cp-bigplay {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.32);
  cursor: pointer;
  transition: opacity .25s;
  z-index: 5;
}
.cp.playing .cp-bigplay { opacity: 0; pointer-events: none; }
.cp-bigplay svg {
  width: 78px; height: 78px;
  background: rgba(26,107,255,0.92);
  border-radius: 50%; padding: 18px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.6);
}

.cp-loader {
  position: absolute; inset: 0;
  display: none; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.3); z-index: 4;
}
.cp.loading .cp-loader { display: flex; }
.cp-loader::after {
  content: ""; width: 54px; height: 54px;
  border: 4px solid rgba(255,255,255,0.18);
  border-top-color: #fff;
  border-radius: 50%;
  animation: cpspin 0.8s linear infinite;
}
@keyframes cpspin { to { transform: rotate(360deg); } }

.cp-controls {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 10px 14px 12px;
  background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.55) 60%, transparent 100%);
  z-index: 6;
  transition: opacity .25s, transform .25s;
  font-family: var(--font-ui);
}
.cp.hide-controls .cp-controls { opacity: 0; transform: translateY(8px); pointer-events: none; }
.cp.hide-controls { cursor: none; }

.cp-seek-row {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 6px;
}
.cp-seek {
  flex: 1; -webkit-appearance: none; appearance: none;
  height: 5px; background: rgba(255,255,255,0.22);
  border-radius: 3px; outline: none; cursor: pointer;
  background-image: linear-gradient(to right, #1a6bff 0%, #1a6bff var(--p,0%), rgba(255,255,255,0.22) var(--p,0%));
}
.cp-seek::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 14px; height: 14px; border-radius: 50%;
  background: #1a6bff; cursor: pointer;
  box-shadow: 0 0 0 3px rgba(26,107,255,0.25);
}
.cp-seek::-moz-range-thumb {
  width: 14px; height: 14px; border-radius: 50%;
  background: #1a6bff; cursor: pointer; border: none;
}
.cp-time { font-size: 0.78rem; color: rgba(255,255,255,0.85); white-space: nowrap; font-variant-numeric: tabular-nums; }

.cp-bot {
  display: flex; align-items: center; gap: 6px;
  flex-wrap: wrap;
}
.cp-bot .cp-spacer { flex: 1; }
.cp-btn {
  background: transparent; color: #fff;
  border: none; padding: 7px 9px;
  border-radius: 6px;
  font-size: 0.82rem; font-family: var(--font-ui);
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  transition: background .15s;
  min-width: 36px; min-height: 36px;
  justify-content: center;
}
.cp-btn:hover { background: rgba(255,255,255,0.14); }
.cp-btn svg { width: 18px; height: 18px; display: block; }
.cp-btn.has-text { padding: 7px 12px; font-weight: 600; }

.cp-vol-wrap { display: flex; align-items: center; gap: 4px; }
.cp-vol {
  width: 0; opacity: 0;
  -webkit-appearance: none; appearance: none;
  height: 4px; background: rgba(255,255,255,0.22);
  border-radius: 3px; outline: none;
  transition: width .2s, opacity .2s;
}
.cp-vol-wrap:hover .cp-vol,
.cp-vol-wrap:focus-within .cp-vol { width: 80px; opacity: 1; margin-left: 4px; }
.cp-vol::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 12px; height: 12px; border-radius: 50%;
  background: #fff; cursor: pointer;
}
.cp-vol::-moz-range-thumb {
  width: 12px; height: 12px; border-radius: 50%;
  background: #fff; cursor: pointer; border: none;
}

.cp-menu {
  position: absolute; bottom: 64px; right: 14px;
  background: rgba(15,18,28,0.96);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 12px;
  padding: 10px 12px;
  min-width: 220px;
  max-width: 320px;
  max-height: 60vh; overflow-y: auto;
  box-shadow: 0 12px 40px rgba(0,0,0,0.6);
  z-index: 8;
  font-size: 0.85rem;
}
.cp-menu[hidden] { display: none; }
.cp-menu h4 {
  font-family: var(--font-ui); font-size: 0.78rem;
  font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; color: rgba(255,255,255,0.55);
  margin-bottom: 8px;
}
.cp-menu-item {
  display: block; width: 100%; text-align: left;
  background: transparent; color: #fff;
  border: none; padding: 8px 10px;
  border-radius: 6px; cursor: pointer;
  font-size: 0.82rem; font-family: var(--font-ui);
  margin-bottom: 2px;
}
.cp-menu-item:hover { background: rgba(255,255,255,0.08); }
.cp-menu-item.active {
  background: rgba(26,107,255,0.22); color: #6ea6ff;
  font-weight: 700;
}
.cp-menu-row {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; margin: 8px 0;
}
.cp-menu-row label { font-size: 0.78rem; color: rgba(255,255,255,0.7); }
.cp-menu-row input[type="range"] { width: 130px; }
.cp-menu-row input[type="number"],
.cp-menu-row input[type="text"],
.cp-menu-row input[type="color"],
.cp-menu-row select {
  background: rgba(255,255,255,0.08);
  color: #fff; border: 1px solid rgba(255,255,255,0.15);
  border-radius: 6px; padding: 5px 8px;
  font-size: 0.78rem;
}
.cp-menu-row select option {
  background: #1a1d2e;
  color: #fff;
}
.cp-menu hr { border: none; border-top: 1px solid rgba(255,255,255,0.1); margin: 8px 0; }
.cp-file-input { display: block; margin-top: 4px; font-size: 0.75rem; color: rgba(255,255,255,0.7); }

.cp-subs-render {
  position: absolute; left: 0; right: 0;
  bottom: 14%;
  text-align: center;
  padding: 0 6%;
  pointer-events: none; z-index: 3;
  font-family: var(--font-ui);
  font-weight: 600;
  text-shadow: 0 2px 4px rgba(0,0,0,0.85), 0 0 6px rgba(0,0,0,0.6);
  white-space: pre-line;
}
.cp-subs-render span {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 4px;
}
.cp.fullscreen-active .cp-subs-render { bottom: 9%; }

.player-wrap:fullscreen,
.player-wrap.cp-fullscreen {
  width: 100vw; height: 100vh;
  border-radius: 0; border: none;
  aspect-ratio: auto;
}

/* ════════════════════════════════════════
   ACTIONS
   ════════════════════════════════════════ */
.actions-row {
  display: flex; gap: 8px;
  justify-content: center; flex-wrap: wrap;
  margin-top: 16px;
}
.action-btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 9px 18px;
  border-radius: var(--radius);
  font-family: var(--font-ui);
  font-weight: 600; font-size: 0.82rem;
  cursor: pointer;
  border: 1px solid var(--border-2);
  background: var(--bg-3); color: var(--text-2);
  transition: all 0.18s;
}
.action-btn svg { width: 14px; height: 14px; }
.action-btn:hover { border-color: var(--border-3); color: var(--text); background: var(--bg-4); }
.action-btn.active-blue { background: var(--blue-dim); border-color: rgba(59,127,255,0.35); color: var(--blue); }
.action-btn.active-red  { background: rgba(240,68,68,0.12); border-color: rgba(240,68,68,0.3); color: #f08080; }
.action-btn.active-green{ background: var(--green-dim); border-color: rgba(34,197,94,0.3); color: var(--green); }

/* ════════════════════════════════════════
   PREV / NEXT EP
   ════════════════════════════════════════ */
.ep-nav-row {
  display: none;
  gap: 10px; justify-content: center; align-items: center;
  margin-top: 14px; flex-wrap: wrap;
}
.ep-nav-row.visible { display: flex; }
.ep-nav-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 11px 22px;
  border-radius: var(--radius);
  border: 1px solid var(--border-2);
  background: var(--bg-3); color: var(--text);
  font-weight: 700; font-size: 0.88rem;
  font-family: var(--font-ui);
  cursor: pointer; transition: all 0.16s;
}
.ep-nav-btn:hover:not(:disabled) { background: var(--bg-4); border-color: var(--blue); }
.ep-nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.ep-nav-btn svg { width: 14px; height: 14px; }
.ep-nav-current {
  font-size: 0.8rem; color: var(--text-2);
  font-family: var(--font-ui); padding: 0 14px;
  font-variant-numeric: tabular-nums;
}

@media(max-width:600px){
  .container { padding: calc(var(--nav-h) + 16px) 14px 60px; }
  .cp-menu { right: 8px; bottom: 60px; min-width: 200px; }
  .cp-btn.has-text { display: none; }
  .ep-nav-btn { padding: 10px 16px; font-size: 0.82rem; }
}

@media (min-width: 1400px) {
  .container { max-width: 1440px; padding: calc(var(--nav-h) + 32px) 32px 80px; }
  .video-title-el { font-size: 2rem; }
  .video-meta-el { font-size: 0.92rem; }
  .cp-btn { min-height: 42px; min-width: 42px; }
  .cp-btn svg { width: 20px; height: 20px; }
}
@media (min-width: 1800px) {
  .container { max-width: 1720px; }
}
</style>
</head>

<body>

<div id="preloader"><div class="loader"></div></div>

<nav id="main-nav"></nav>

<div class="container">

  <div id="top-loader" class="loader" style="padding:40px 0 20px"></div>

  <div id="video-main" style="display:none">

    <div class="video-meta-row">
      <button class="btn-back" id="btn-back" title="Retour">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="15 18 9 12 15 6"/></svg>
        <span>Retour</span>
      </button>
      <div class="video-title-el" id="vtitle"></div>
      <div class="video-meta-el" id="vmeta"></div>
    </div>

    <div class="servers-row" id="servers-row"></div>

    <div class="player-wrap" id="player-wrap">
      <iframe id="player" allowfullscreen allow="autoplay; fullscreen; encrypted-media"></iframe>
    </div>

    <div class="ep-nav-row" id="ep-nav-row">
      <button class="ep-nav-btn" id="prev-ep">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="15 18 9 12 15 6"/></svg>
        Précédent
      </button>
      <span class="ep-nav-current" id="ep-current"></span>
      <button class="ep-nav-btn" id="next-ep">
        Suivant
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>

    <div class="actions-row" id="actions-row"></div>

  </div>
</div>

<footer>© 2026 Turgot+</footer>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script type="module" src="js/video.js"></script>

</body>
</html>
